# MLOPS-17: production compose for the live stack (replaces the STALE
# docker-compose.yml that referenced nonexistent Dockerfiles).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The dashboard needs SESSION_SECRET (fail-closed without it, SEC-01) and a
# DATABASE_URL pointing at the SQLite volume. The sidecar mounts the models dir
# so checkpoints can be updated without rebuilding (pinned by manifest, MLOPS-05).
services:
  sidecar:
    build:
      context: .
      dockerfile: ml-inference/Dockerfile
    ports: ["8001:8001"]
    environment:
      TCN_API_KEY: ${TCN_API_KEY:-}
      ALERT_THRESHOLD: ${ALERT_THRESHOLD:-0.5}
      MIN_TRAILING_VOL_BPS: ${MIN_TRAILING_VOL_BPS:-2}
      ALERT_COOLDOWN_MS: ${ALERT_COOLDOWN_MS:-10000}
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  stream:
    build:
      context: flash-crash-watchdog-web
      dockerfile: mini-services/binance-stream/Dockerfile
    depends_on:
      sidecar:
        condition: service_healthy
    ports: ["3003:3003"]
    environment:
      TCN_INFERENCE_URL: http://sidecar:8001/score
      TCN_API_KEY: ${TCN_API_KEY:-}
      USE_TCN: "true"
      CORRELATION_SYMBOLS: ${CORRELATION_SYMBOLS:-ETHUSDT}
      CORR_FLOOR: ${CORR_FLOOR:-0.4}
      CORR_SUSTAIN_S: ${CORR_SUSTAIN_S:-60}
    restart: unless-stopped

  dashboard:
    build:
      context: flash-crash-watchdog-web
      dockerfile: Dockerfile
    depends_on:
      - stream
    ports: ["3000:3000"]
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?set a strong SESSION_SECRET}
      NODE_ENV: production
      DATABASE_URL: "file:/data/custom.db"
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3003
      TCN_INFERENCE_URL: http://sidecar:8001/score
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/me').then(r=>process.exit(r.status===200||r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  sqlite_data:
