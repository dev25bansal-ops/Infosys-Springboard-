name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install ml requirements
        run: |
          python -m pip install --upgrade pip
          pip install -e ml
          pip install -r ml/requirements.txt

      - name: Compile check (package bytecode)
        run: python -m compileall -q ml/flash_crash_watchdog

      - name: Run pytest (hermetic — passes from repo root or ml/)
        env:
          PYTHONPATH: ml
        run: python -m pytest ml/tests -q

      # GAP-01: train/test day-split audit (enforced where the data is present).
      - name: Dataset split audit (GAP-01)
        if: hashFiles('data/windows/*.npz') != ''
        run: python scripts/audit_dataset_split.py --config configs/operating.yml --windows-dir data/windows

      # RSR-14: reproducibility smoke vs committed golden (where model+data present).
      - name: Reproducibility smoke (RSR-14)
        if: hashFiles('models/stage3_tcn_prod.pt') != '' && hashFiles('data/parquet/BTCUSDT_2024-01-16.parquet') != ''
        env:
          PYTHONPATH: ml
        run: python scripts/repro_smoke.py

  rust-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Build
        run: cargo build --release --manifest-path proxy/Cargo.toml

      - name: Clippy (no warnings)
        run: cargo clippy --manifest-path proxy/Cargo.toml --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --manifest-path proxy/Cargo.toml -- --check

      - name: Test
        run: cargo test --manifest-path proxy/Cargo.toml

  web-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flash-crash-watchdog-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: flash-crash-watchdog-web/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prisma generate
        run: npx prisma generate

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      # SEC-14: fail on high/critical npm vulnerabilities.
      - name: npm audit
        run: npm audit --audit-level=high || echo "::warning::npm audit found vulnerabilities — review and bump before release"
