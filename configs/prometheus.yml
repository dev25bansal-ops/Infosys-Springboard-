global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # NEW-02: the inference sidecar's /metrics (prometheus_client).
  - job_name: "flash-crash-inference"
    static_configs:
      - targets: ["127.0.0.1:8000"]

  # NEW-02: the Binance stream service /metrics on its dedicated health port.
  - job_name: "flash-crash-stream"
    static_configs:
      - targets: ["127.0.0.1:3005"]
