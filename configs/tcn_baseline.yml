# TCN baseline model config — used for training
# python -m flash_crash_watchdog.cli train --model configs/tcn_baseline.yml

num_channels: [64, 64, 64, 64, 64, 64, 64, 64]  # 8 layers
kernel_size: 3
input_dim: 17
dropout: 0.1
sequence_length: 500

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  focal_loss_gamma: 2.0  # for class imbalance
  focal_loss_alpha: 0.25

pretraining:
  enabled: true
  mask_ratio: 0.15
  epochs: 20
